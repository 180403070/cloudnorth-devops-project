version: '3.8'

services:
  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - cloudnorth-network

  backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - cloudnorth-network

networks:
  cloudnorth-network:
    driver: bridge
